[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rsw"
version = "0.1.0"
description = "Pull-test force prediction for resistance spot welding"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Samuel Rusch" }]
license = { text = "MIT" }
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.13.1",
    "scikit-learn==1.5.1",
    "xgboost==2.1.1",
    "tabpfn==2.0.9",
    "torch==2.4.1",
    "hyperopt==0.2.7",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "joblib==1.4.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.2", "ruff==0.6.4"]

[tool.setuptools]
packages = ["rsw"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
